<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Livraria XYZ</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <h1>Livraria XYZ</h1>
    <p>Explore nossa coleção de livros incríveis!</p>

    <div class="card-container">
      <div class="card destaque" id="turma-monica-lacos">
        <h2>Turma da Mônica: Laços</h2>
        <p>Uma história de amizade que atravessa gerações no Bairro do Limoeiro.</p>
        <button class="btn">Comprar</button>
      </div>

      <div class="card" id="turma-monica-licoes">
        <h2>Turma da Mônica: Lições</h2>
        <p>A turma cresce, e cada descoberta vem acompanhada de uma nova lição.</p>
        <button class="btn">Comprar</button>
      </div>
    </div>

    <p>Revise seus livros e continue para o pagamento.</p>

    <div class="btn-container">
      <button id="view-cart-btn" class="btn">Ver carrinho</button>
      <button id="checkout-btn" class="btn btn-primary">Finalizar compra</button>
    </div>
  </body>
</html>
